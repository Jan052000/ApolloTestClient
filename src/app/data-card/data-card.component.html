<mat-card>
    <mat-card-header>
        <mat-card-title>{{ cardContent.name }}</mat-card-title>
    </mat-card-header>
    <mat-card-content>
        <ng-template #nodeTemplateRef let-node="node">
            <div class="box">
                <mat-label *ngIf="!isNumber(node.displayText) && node.children.length > 0 && !isName(node.name) && node.displayText != ''" class="spacer">{{ node.displayText }}</mat-label>
                <div class="block-layout">
                    <mat-form-field appearance="fill" floatLabel="always" *ngIf="node.value != undefined">
                        <mat-label>{{ node.displayText }}</mat-label>
                        <textarea matInput [formControl]="registerFormControl(node)"
                        [readonly]="readonly"
                        cdkTextareaAutosize
                        cdkAutosizeMinRows="1"></textarea>
                    </mat-form-field>
                    <ng-template ngFor let-child [ngForOf]="node.children">
                        <ng-template [ngTemplateOutlet]="nodeTemplateRef" [ngTemplateOutletContext]="{ node: child }"></ng-template>
                    </ng-template>
                </div>
            </div>
        </ng-template>
        <ng-template [ngTemplateOutlet]="nodeTemplateRef" [ngTemplateOutletContext]="{ node: cardData}"></ng-template>
    </mat-card-content>
    <div class="sticky-container">
        <button mat-raised-button color="primary" (click)="editButtonPressed()" class="sticky">
            <mat-icon *ngIf="readonly">edit</mat-icon>
            <mat-icon *ngIf="!readonly">save</mat-icon>
        </button>
    </div>
</mat-card>
