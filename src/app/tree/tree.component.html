<mat-tree [dataSource]="dataSource" [treeControl]="treeControl" class="test">
    <mat-tree-node *matTreeNodeDef="let node" matTreeNodeToggle class="disable-text-select" (click)="select(node, true, $event)" [ngClass]="{ highlight: selectedNode === node}">
        <!-- <button mat-button disableRipple class="disable-text-select" (click)="test()">{{ node.name }}</button> -->
        {{ node.name }}
    </mat-tree-node>
    <mat-nested-tree-node *matTreeNodeDef="let node; when: hasChild" (click)="select(node, true, $event)">
        <div class="mat-tree-node disable-text-select" [ngClass]="{ highlight: selectedNode === node}">
            <button mat-icon-button matTreeNodeToggle>
                <mat-icon>
                    {{ treeControl.isExpanded(node) ?"expand_more": "chevron_right" }}
                </mat-icon>
            </button>
            <!-- <button mat-button disableRipple class="disable-text-select" (click)="test()">{{ node.name }}</button> -->
            {{ node.name }}
        </div>
        <div class="nested-node" [class.tree-invisible]="!treeControl.isExpanded(node)" role="group">
            <ng-container matTreeNodeOutlet></ng-container>
        </div>
    </mat-nested-tree-node>
</mat-tree>
